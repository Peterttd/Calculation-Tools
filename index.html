<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculation Tools | Ferramentas Online</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 20px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 0; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    nav a { color: var(--text); text-decoration: none; font-weight: 500; }
    main.container { flex: 1; padding-top: 40px; padding-bottom: 40px; }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { font-size: 2.25rem; margin-bottom: 12px; }
    .hero p { color: var(--muted); font-size: 1.1rem; }
    .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }
    .tool-card h3 { font-size: 1.2rem; color: var(--primary); margin-bottom: 8px; }
    .tool-card p { font-size: 0.95rem; color: var(--muted); flex: 1; margin-bottom: 16px; }
    .btn-link { font-weight: 600; color: var(--primary); font-size: 0.9rem; }
    footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 24px 0; text-align: center; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Calculation Tools</a>
      <nav><a href="index.html">Home</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Ferramentas de Cálculo Online</h1>
      <p>Calcule porcentagens, valores e conversões de forma rápida e gratuita.</p>
    </section>

    <section class="tools-grid">
      <a href="calculators/percentage-calculator/index.html" class="tool-card">
        <h3>Calculadora de Porcentagem</h3>
        <p>Calcule aumentos, descontos e variações percentuais em segundos.</p>
        <span class="btn-link">Acessar ferramenta &rarr;</span>
      </a>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Calculation Tools. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
