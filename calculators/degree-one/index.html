<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equação do 1º Grau | Calculation Tools</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
      --accent: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .container { width: 100%; max-width: 850px; margin: 0 auto; padding: 0 20px; }
    header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 18px 0; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 1.1rem; font-weight: 600; color: var(--primary); text-decoration: none; transition: color 0.2s; }
    .logo:hover { color: var(--text); }
    main { flex: 1; padding: 40px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .desc { color: var(--muted); margin-bottom: 28px; font-size: 1rem; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.875rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    input { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 1.1rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    button { background: var(--primary); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s, transform 0.1s; }
    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.99); }
    .result-box { margin-top: 28px; padding: 20px; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; display: none; }
    .result-box h3 { font-size: 1.1rem; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
    .result-val { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .chart-container { margin-top: 28px; position: relative; height: 380px; background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="../../index.html" class="logo">&larr; Voltar às Ferramentas</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Equação do 1º Grau</h1>
      <p class="desc">Gráfico cartesiano e resolução da equação <strong>ax + b = 0</strong></p>

      <div class="inputs">
        <div class="input-group">
          <label for="a">Coeficiente (a)</label>
          <input type="number" id="a" value="2" step="any">
        </div>
        <div class="input-group">
          <label for="b">Coeficiente (b)</label>
          <input type="number" id="b" value="-4" step="any">
        </div>
      </div>

      <button onclick="calculate()">Calcular & Gerar Gráfico</button>

      <div id="result" class="result-box"></div>
      
      <div id="chart-wrapper" class="chart-container">
        <canvas id="equationChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    let chartInstance = null;

    function calculate() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const resultDiv = document.getElementById('result');
      const chartWrapper = document.getElementById('chart-wrapper');

      if (isNaN(a) || isNaN(b)) return;

      if (a === 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = b === 0 ? '<h3>Resultado</h3><div class="result-val">Infinitas Soluções</div>' : '<h3>Resultado</h3><div class="result-val" style="color:var(--accent)">Sem Solução</div>';
        chartWrapper.style.display = 'none';
        return;
      }

      const root = -b / a;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <h3>Raiz da Equação (x)</h3>
        <div class="result-val">x = ${Number(root.toFixed(4))}</div>
      `;

      chartWrapper.style.display = 'block';
      renderChart(a, b, root);
    }

    function renderChart(a, b, root) {
      const ctx = document.getElementById('equationChart').getContext('2d');
      const margin = Math.max(Math.abs(root) * 2, 6);
      const xMin = Math.floor(root - margin);
      const xMax = Math.ceil(root + margin);
      const yMin = Math.floor(a * xMin + b);
      const yMax = Math.ceil(a * xMax + b);

      const dataPoints = [];
      for (let x = xMin; x <= xMax; x += (xMax - xMin) / 100) {
        dataPoints.push({ x: x, y: a * x + b });
      }

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'f(x) = ' + a + 'x + ' + b,
              data: dataPoints,
              borderColor: '#3b82f6',
              borderWidth: 3,
              pointRadius: 0,
              tension: 0
            },
            {
              label: 'Raiz: (' + Number(root.toFixed(2)) + ', 0)',
              data: [{ x: root, y: 0 }],
              backgroundColor: '#ef4444',
              borderColor: '#ffffff',
              borderWidth: 2,
              pointRadius: 7,
              pointHoverRadius: 9,
              showLine: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'sans-serif', size: 12 } } } },
          scales: {
            x: {
              type: 'linear', position: 'center',
              grid: { color: (ctx) => ctx.tick.value === 0 ? '#64748b' : '#334155', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 },
              ticks: { color: '#94a3b8' }
            },
            y: {
              type: 'linear', position: 'center',
              grid: { color: (ctx) => ctx.tick.value === 0 ? '#64748b' : '#334155', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 },
              ticks: { color: '#94a3b8' }
            }
          }
        }
      });
    }
    calculate();
  </script>
</body>
</html>
