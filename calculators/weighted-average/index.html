<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Média Ponderada | Calculation Tools</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 20px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 0; }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    main { flex: 1; padding: 32px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .desc { color: var(--muted); margin-bottom: 24px; }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    input { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: #fff; color: var(--text); }
    input:focus { border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .result-box { margin-top: 24px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; display: none; }
    .result-box p { margin-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="../../index.html" class="logo">&larr; Calculation Tools</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Calculadora de Média Ponderada</h1>
      <p class="desc">Insira os valores e os respectivos pesos separados por vírgula.</p>

      <div class="inputs">
        <div class="input-group">
          <label for="values">Valores</label>
          <input type="text" id="values" placeholder="Ex: 8, 7, 10">
        </div>
        <div class="input-group">
          <label for="weights">Pesos</label>
          <input type="text" id="weights" placeholder="Ex: 2, 3, 5">
        </div>
      </div>

      <button onclick="calculate()">Calcular Média Ponderada</button>

      <div id="result" class="result-box"></div>
    </div>
  </main>

  <script>
    function calculate() {
      const valStr = document.getElementById('values').value;
      const weightStr = document.getElementById('weights').value;
      const resultDiv = document.getElementById('result');

      if (!valStr || !weightStr) {
        alert('Por favor, preencha ambos os campos.');
        return;
      }

      const vals = valStr.split(',').map(item => parseFloat(item.trim()));
      const weights = weightStr.split(',').map(item => parseFloat(item.trim()));

      if (vals.some(isNaN) || weights.some(isNaN)) {
        alert('Digite apenas números válidos separados por vírgula.');
        return;
      }

      if (vals.length !== weights.length) {
        alert('A quantidade de valores deve ser igual à quantidade de pesos.');
        return;
      }

      let sumProducts = 0;
      let sumWeights = 0;

      for (let i = 0; i < vals.length; i++) {
        sumProducts += vals[i] * weights[i];
        sumWeights += weights[i];
      }

      if (sumWeights === 0) {
        alert('A soma dos pesos não pode ser zero.');
        return;
      }

      const weightedAvg = sumProducts / sumWeights;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <h3>Resultado:</h3>
        <p><strong>Média Ponderada:</strong> ${weightedAvg.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
