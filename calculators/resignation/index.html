<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Rescisão | Calculation Tools</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 20px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 0; }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    main { flex: 1; padding: 32px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .desc { color: var(--muted); margin-bottom: 24px; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    input, select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; background: #fff; color: var(--text); }
    input:focus, select:focus { border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .result-box { margin-top: 24px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; display: none; }
    .result-box p { margin-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="../../index.html" class="logo">&larr; Calculation Tools</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Calculadora de Rescisão</h1>
      <p class="desc">Estime os valores devidos em uma rescisão de contrato sem justa causa.</p>

      <div class="inputs">
        <div class="input-group">
          <label for="salary">Último Salário (R$)</label>
          <input type="number" id="salary" placeholder="Ex: 3000" step="any">
        </div>
        <div class="input-group">
          <label for="months">Meses Trabalhados no Ano</label>
          <input type="number" id="months" placeholder="Ex: 8" min="1" max="12">
        </div>
        <div class="input-group">
          <label for="days">Dias Trabalhados no Mês da Rescisão</label>
          <input type="number" id="days" placeholder="Ex: 15" min="0" max="31">
        </div>
      </div>

      <button onclick="calculate()">Calcular Rescisão</button>

      <div id="result" class="result-box"></div>
    </div>
  </main>

  <script>
    function calculate() {
      const salVal = document.getElementById('salary').value;
      const monVal = document.getElementById('months').value;
      const dayVal = document.getElementById('days').value;
      const resultDiv = document.getElementById('result');

      if (salVal === '' || monVal === '' || dayVal === '') {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      const salary = parseFloat(salVal);
      const months = parseInt(monVal);
      const days = parseInt(dayVal);

      if (isNaN(salary) || isNaN(months) || isNaN(days)) return;

      const saldoSalario = (salary / 30) * days;
      const avisoPrevio = salary; // Indenizado base simples
      const decimoTerceiro = (salary / 12) * months;
      const feriasProporcionais = (salary / 12) * months * (4/3); // Férias + 1/3
      const totalRescisao = saldoSalario + avisoPrevio + decimoTerceiro + feriasProporcionais;

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <h3>Estimativa de Rescisão:</h3>
        <p><strong>Saldo de Salário (${days} dias):</strong> R$ ${saldoSalario.toFixed(2)}</p>
        <p><strong>Aviso Prévio Indenizado:</strong> R$ ${avisoPrevio.toFixed(2)}</p>
        <p><strong>13º Salário Proporcional (${months} meses):</strong> R$ ${decimoTerceiro.toFixed(2)}</p>
        <p><strong>Férias Proporcionais + 1/3:</strong> R$ ${feriasProporcionais.toFixed(2)}</p>
        <p><strong>Total Estimado:</strong> R$ ${totalRescisao.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
