<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equação do 2º Grau | Calculation Tools</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 0 20px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 0; }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    main { flex: 1; padding: 40px 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { margin-bottom: 8px; font-size: 1.8rem; }
    .desc { color: var(--muted); margin-bottom: 24px; }
    .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    input { padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .result-box { margin-top: 24px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; display: none; }
    .chart-container { margin-top: 24px; position: relative; height: 320px; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="../../index.html" class="logo">&larr; Calculation Tools</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Equação do 2º Grau</h1>
      <p class="desc">Resolve equações do tipo <strong>ax² + bx + c = 0</strong></p>

      <div class="inputs">
        <div class="input-group">
          <label for="a">a</label>
          <input type="number" id="a" value="1" step="any">
        </div>
        <div class="input-group">
          <label for="b">b</label>
          <input type="number" id="b" value="-5" step="any">
        </div>
        <div class="input-group">
          <label for="c">c</label>
          <input type="number" id="c" value="6" step="any">
        </div>
      </div>

      <button onclick="calculate()">Calcular e Gerar Gráfico</button>

      <div id="result" class="result-box"></div>

      <div id="chart-wrapper" class="chart-container">
        <canvas id="equationChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    let chartInstance = null;

    function calculate() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const c = parseFloat(document.getElementById('c').value);
      const resultDiv = document.getElementById('result');
      const chartWrapper = document.getElementById('chart-wrapper');

      if (isNaN(a) || isNaN(b) || isNaN(c)) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p style="color:red">Preencha todos os campos corretamente.</p>';
        return;
      }

      if (a === 0) {
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p style="color:red">O coeficiente "a" deve ser diferente de 0 para ser de 2º grau.</p>';
        chartWrapper.style.display = 'none';
        return;
      }

      const delta = (b * b) - (4 * a * c);
      let roots = [];
      let html = `<h3>Resultado:</h3><p><strong>&Delta;:</strong> ${delta.toFixed(4)}</p>`;

      if (delta > 0) {
        const x1 = (-b + Math.sqrt(delta)) / (2 * a);
        const x2 = (-b - Math.sqrt(delta)) / (2 * a);
        roots = [x1, x2];
        html += `<p><strong>x₁:</strong> ${x1.toFixed(4)}</p><p><strong>x₂:</strong> ${x2.toFixed(4)}</p>`;
      } else if (delta === 0) {
        const x = -b / (2 * a);
        roots = [x];
        html += `<p><strong>x (raiz única):</strong> ${x.toFixed(4)}</p>`;
      } else {
        html += `<p>Não existem raízes reais (&Delta; < 0).</p>`;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = html;

      chartWrapper.style.display = 'block';
      renderChart(a, b, c, roots);
    }

    function renderChart(a, b, c, roots) {
      const ctx = document.getElementById('equationChart').getContext('2d');
      const xVertex = -b / (2 * a);
      
      const spread = roots.length > 1 ? Math.max(Math.abs(roots[0] - roots[1]), 4) : 6;
      const xMin = xVertex - spread;
      const xMax = xVertex + spread;

      const dataPoints = [];
      const steps = 100;
      const stepSize = (xMax - xMin) / steps;

      for (let i = 0; i <= steps; i++) {
        const x = xMin + (i * stepSize);
        dataPoints.push({ x: x, y: (a * x * x) + (b * x) + c });
      }

      const rootPoints = roots.map(r => ({ x: r, y: 0 }));

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Parábola',
              data: dataPoints,
              borderColor: '#2563eb',
              borderWidth: 2,
              fill: false,
              pointRadius: 0
            },
            {
              label: 'Raízes Reais',
              data: rootPoints,
              backgroundColor: '#ef4444',
              borderColor: '#ef4444',
              pointRadius: 6,
              pointHoverRadius: 8,
              showLine: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', position: 'bottom', title: { display: true, text: 'X' } },
            y: { title: { display: true, text: 'Y' } }
          }
        }
      });
    }
  </script>
</body>
</html>
